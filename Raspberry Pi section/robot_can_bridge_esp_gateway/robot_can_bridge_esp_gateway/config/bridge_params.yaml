can_bridge:
  ros__parameters:
    interface: "can0"
    cmd_period_s: 0.10
    cmd_timeout_s: 0.60
    forward_pwm: 135
    turn_pwm: 120
    backward_pwm: 115
    linear_deadband: 0.04
    angular_deadband: 0.20
    wheel_base_m: 0.285
    # Convert S32K feedback unit in CAN 0x222 to m/s. Tune experimentally.
    # Start small. If RViz odom moves too slow, increase; too fast, decrease.
    feedback_unit_to_mps: 0.0010
    publish_odom_tf: true
    odom_frame: "odom"
    base_frame: "base_link"

checkpoint_follower:
  ros__parameters:
    map_frame: "map"
    base_frame: "base_link"
    goal_tolerance_m: 0.20
    heading_tolerance_rad: 0.22
    forward_speed_mps: 0.16
    turn_speed_radps: 0.45
    control_period_s: 0.10
